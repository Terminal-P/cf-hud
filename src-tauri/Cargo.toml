[package]
name = "cf-hud"
version = "0.1.0"
description = "A cross-platform floating HUD for Codeforces contests"
authors = ["CF HUD contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/cf-hud/cf-hud"

[lib]
name = "cf_hud_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
